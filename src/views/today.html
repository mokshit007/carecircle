<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today's medicines</title>
<style>
  :root { --bg:#fbf8f2; --card:#fff; --ink:#1d2330; --muted:#677083; --line:#ebe5d9; --accent:#0b7a75; --taken:#1f8a4c; --taken-soft:#e3f4ea; --due:#a8670f; --due-soft:#fdf0d9; --missed:#b93a2e; --missed-soft:#fbe6e3; --up:#5b6678; --up-soft:#eef1f5; }
  [data-theme="dark"] { --bg:#10141a; --card:#1a1f28; --ink:#eef1f5; --muted:#9aa4b5; --line:#2a313d; --accent:#3cc4bc; --taken-soft:#173322; --due-soft:#3a2b10; --missed-soft:#3d1c18; --up-soft:#232a35; }
  * { box-sizing: border-box; }
  body { margin:0; font: 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); padding: 18px; }
  h1 { font-size: 26px; margin: 0; }
  .sub { color: var(--muted); margin: 2px 0 14px; }
  .next { background: var(--accent); color: #fff; border-radius: 16px; padding: 14px 18px; font-size: 20px; margin-bottom: 14px; }
  .next.done { background: var(--taken); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
  .slot { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
  .slot.due { border-color: var(--due); } .slot.missed { border-color: var(--missed); }
  .time { font-weight: 700; font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .name { font-size: 22px; font-weight: 700; }
  .meta { color: var(--muted); font-size: 15px; }
  .chip { align-self: flex-start; font-size: 13px; font-weight: 800; padding: 4px 12px; border-radius: 999px; text-transform: uppercase; letter-spacing: .05em; }
  .chip.taken { background: var(--taken-soft); color: var(--taken); } .chip.skipped, .chip.upcoming { background: var(--up-soft); color: var(--up); }
  .chip.due { background: var(--due-soft); color: var(--due); } .chip.missed { background: var(--missed-soft); color: var(--missed); }
  button { font: inherit; font-size: 19px; font-weight: 700; border: 0; border-radius: 12px; padding: 12px; cursor: pointer; background: var(--accent); color: #fff; margin-top: 4px; }
  button:disabled { opacity: .6; cursor: default; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
  <h1 id="greeting">Today's medicines</h1>
  <div class="sub" id="sub">Loading…</div>
  <div class="next" id="next" hidden></div>
  <div class="grid" id="grid"></div>
<script type="module">
  const { App } = globalThis.McpApps;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const app = new App({ name: 'CareCircle Today', version: '2.0.0' });

  function greeting(now) {
    const h = Number(now.slice(0, 2));
    return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  }

  function render(t) {
    if (!t?.slots) return;
    $('greeting').textContent = `${greeting(t.now)}, ${t.recipient}`;
    $('sub').textContent = `${t.weekday} · ${t.taken} of ${t.total} taken today`;
    const next = $('next');
    next.hidden = false;
    const overdue = t.slots.filter((s) => s.status === 'missed' || s.status === 'due');
    next.className = 'next' + (overdue.length || t.next ? '' : ' done');
    next.textContent = overdue.length
      ? `Time to take: ${overdue.map((s) => s.medication).join(', ')}`
      : t.next ? `Next: ${t.next.medication} at ${t.next.time}` : 'All done for today. Well done!';
    $('grid').innerHTML = t.slots.map((s) => `
      <div class="slot ${s.status}">
        <div class="time">${esc(s.spokenTime)}</div>
        <div class="name">${esc(s.medication)}</div>
        <div class="meta">${esc(s.dose)}${s.withFood ? ' · with food' : ''}${s.purpose ? ' · for ' + esc(s.purpose) : ''}</div>
        <span class="chip ${s.status}">${s.status === 'missed' ? 'overdue' : s.status}</span>
        ${s.status === 'due' || s.status === 'missed' ? `<button data-key="${esc(s.key)}">I took it</button>` : ''}
      </div>`).join('') || '<p class="empty">No medicines scheduled.</p>';
  }

  $('grid').addEventListener('click', async (ev) => {
    const btn = ev.target.closest('button[data-key]');
    if (!btn) return;
    btn.disabled = true;
    btn.textContent = 'Saving…';
    const result = await app.callServerTool({ name: 'confirm_dose_from_screen', arguments: { slot_key: btn.dataset.key } });
    render(result.structuredContent?.today);
    app.updateModelContext({ content: [{ type: 'text', text: result.content?.[0]?.text || 'Dose confirmed on screen.' }] }).catch(() => {});
  });

  app.ontoolresult = (result) => render(result.structuredContent);
  app.onhostcontextchanged = (ctx) => { if (ctx.theme) document.documentElement.dataset.theme = ctx.theme; };
  await app.connect();
  const theme = app.getHostContext()?.theme;
  if (theme) document.documentElement.dataset.theme = theme;
</script>
</body>
</html>
